name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable Windows app
        run: pnpm package:windows

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP package
        shell: pwsh
        run: Compress-Archive -Path release\win-unpacked\* -DestinationPath "ClipNest-${{ steps.package.outputs.version }}-windows.zip" -CompressionLevel Optimal

      - name: Upload installer, metadata and ZIP to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClipNest-${{ steps.package.outputs.version }}-windows.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
          fail_on_unmatched_files: true
