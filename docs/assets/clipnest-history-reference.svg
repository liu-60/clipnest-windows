<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="288" viewBox="0 0 1440 288" role="img" aria-labelledby="title desc">
  <title id="title">ClipNest 剪切板历史卡片界面</title>
  <desc id="desc">浅灰色 Paste 风格的剪切板历史卡片网格，包含文本、文件与图片。</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#4b8ef7"/><stop offset="1" stop-color="#3b7ee7"/></linearGradient>
    <linearGradient id="sky" x1="0" x2="1"><stop stop-color="#61a9ed"/><stop offset="1" stop-color="#74c2f7"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ef3d3a"/><stop offset="1" stop-color="#ff524b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8c8f98" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1440" height="288" fill="#f4f4f5"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g fill="#4d4e54" font-size="16" font-weight="600">
      <text x="569" y="34">⌕</text><rect x="597" y="15" width="170" height="30" rx="15" fill="#e6e6e8"/><circle cx="612" cy="30" r="5" fill="#b6b8bc"/><text x="624" y="35" font-size="13">剪贴板历史记录</text>
      <circle cx="793" cy="30" r="6" fill="#f25b5d"/><text x="808" y="35" font-size="13">实用链接</text><text x="864" y="36" font-size="24" font-weight="300">＋</text><text x="1395" y="36" font-size="24">•••</text>
    </g>
    <g filter="url(#shadow)">
      <g><rect x="28" y="64" width="260" height="202" rx="8" fill="#fff"/><rect x="28" y="64" width="260" height="58" rx="8" fill="url(#blue)"/><rect x="211" y="64" width="77" height="58" fill="#fff" opacity=".92"/><circle cx="249" cy="93" r="25" fill="#e4e8ed"/><circle cx="249" cy="93" r="20" fill="#f5f5f5"/><path d="M238 88h22v16h-22z" fill="#5290ec"/><text x="42" y="91" fill="#fff" font-size="18" font-weight="700">文本</text><text x="42" y="108" fill="#dceaff" font-size="12">2 分钟前</text><text x="42" y="150" fill="#27282c" font-size="14" font-weight="700">标题：Paste，让复制过的内容</text><text x="42" y="171" fill="#4c4d52" font-size="13">随时可见。用一条快捷键打开历史，</text><text x="42" y="190" fill="#4c4d52" font-size="13">找回文字、链接或图片。</text><path d="M42 210h226M42 230h226M42 250h178" stroke="#e5e5e7"/><text x="42" y="261" fill="#9b9da2" font-size="10">128 个字符</text></g>
      <g><rect x="307" y="64" width="260" height="202" rx="8" fill="#fff"/><rect x="307" y="64" width="260" height="58" rx="8" fill="url(#sky)"/><rect x="490" y="64" width="77" height="58" fill="#fff" opacity=".92"/><circle cx="527" cy="93" r="24" fill="#e9edf2"/><path d="M516 84h22l6 7v20h-28z" fill="#fff" stroke="#9ba2ad"/><path d="M538 84v8h7M521 100h17M521 106h17" fill="none" stroke="#7d8793"/><text x="321" y="91" fill="#fff" font-size="18" font-weight="700">1 个文件</text><text x="321" y="108" fill="#e2f1ff" font-size="12">9 小时前</text><text x="337" y="232" fill="#4d4e54" font-size="12">…/桌面/Mac 安装镜像/Paste</text><text x="478" y="252" fill="#7d7f85" font-size="11">5.7 MB</text></g>
      <g><rect x="586" y="64" width="260" height="202" rx="8" fill="#fff"/><rect x="586" y="64" width="260" height="58" rx="8" fill="url(#red)"/><rect x="769" y="64" width="77" height="58" fill="#fff" opacity=".92"/><text x="600" y="91" fill="#fff" font-size="18" font-weight="700">图片</text><text x="600" y="108" fill="#ffe6e6" font-size="12">9 小时前</text><rect x="594" y="104" width="254" height="137" fill="#e8e8e8"/><path d="M584 222L642 164l31 29 47-54 112 104z" fill="#7e9ab5"/><path d="M584 240l74-42 38 31 54-42 100 63z" fill="#5d8d86"/><circle cx="760" cy="140" r="21" fill="#ffd15c"/><text x="660" y="257" fill="#74767c" font-size="11">823 × 425</text></g>
      <g><rect x="866" y="64" width="260" height="202" rx="8" fill="#fff" stroke="#2d7ae6" stroke-width="5"/><rect x="868" y="66" width="256" height="56" rx="6" fill="url(#blue)"/><rect x="1050" y="66" width="74" height="56" fill="#fff" opacity=".92"/><circle cx="1087" cy="93" r="25" fill="#e4e8ed"/><circle cx="1087" cy="93" r="20" fill="#f5f5f5"/><path d="M1076 88h22v16h-22z" fill="#5290ec"/><text x="882" y="91" fill="#fff" font-size="18" font-weight="700">文本</text><text x="882" y="108" fill="#dceaff" font-size="12">10 小时前</text><text x="882" y="148" fill="#25272b" font-family="Consolas, monospace" font-size="13">1. https://developer.android.com/</text><text x="882" y="169" fill="#25272b" font-family="Consolas, monospace" font-size="13">   tools/releases/platform-tools</text><path d="M882 188h224M882 208h224M882 228h224" stroke="#e5e5e7"/><text x="1058" y="258" fill="#74767c" font-size="11">73 个字符</text></g>
      <g><rect x="1146" y="64" width="260" height="202" rx="8" fill="#fff"/><rect x="1146" y="64" width="260" height="58" rx="8" fill="url(#blue)"/><rect x="1329" y="64" width="77" height="58" fill="#fff" opacity=".92"/><circle cx="1366" cy="93" r="25" fill="#e4e8ed"/><circle cx="1366" cy="93" r="20" fill="#f5f5f5"/><path d="M1355 88h22v16h-22z" fill="#5290ec"/><text x="1162" y="91" fill="#fff" font-size="18" font-weight="700">文本</text><text x="1162" y="108" fill="#dceaff" font-size="12">10 小时前</text><text x="1162" y="150" fill="#4d4e54" font-family="Consolas, monospace" font-size="14">adb (</text><path d="M1162 174h226M1162 195h226M1162 216h226M1162 237h226" stroke="#e5e5e7"/><text x="1360" y="258" fill="#74767c" font-size="11">4 个字符</text></g>
    </g>
  </g>
</svg>
